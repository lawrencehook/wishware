<script src="portrait.js"></script>
<script src="composers/index.js"></script>
<script>
const portraits = [];
for (const composer of COMPOSER_INDEX) {
    const card = document.createElement('a');
    card.className = 'feature';
    card.href = 'composer.html?c=' + composer.id;
    const parts = [['span', 'eyebrow', composer.years], ['h3', '', composer.name], ['canvas'], ['span', 'meta', composer.works + ' works']];
    for (const [tag, className, text] of parts) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text) node.textContent = text;
        if (tag === 'canvas') {
            node.setAttribute('aria-hidden', 'true');
            portraits.push([node, composer.portrait, true]);
        }
        card.append(node);
    }
    document.querySelector('#composers').append(card);
}
new ResizeObserver(() => portraits.forEach(args => portrait(...args))).observe(document.querySelector('main'));
</script></html>
