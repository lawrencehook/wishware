<script src="lens.js"></script><script src="player.js"></script><script>
// player.js, fed by a piece in pieces/<p>/: notes.js holds
// {movements: [{name, notes: [[seconds, pitch, length, hand, velocity], ...]}]} and
// measures.js adds notation = {bars: [[quarter, number, meter, key]], tempo: [[seconds, quarter, bpm]]}.
// notation/<p>/<m>.js, made by engrave.py, places each measure on the printed edition.
const params = new URLSearchParams(location.search);
const composerId = params.get('c') ?? '', folder = params.get('p') ?? '', movementIndex = Number(params.get('m') ?? 0);
const voiceColors = ['#e9ce80','#8acfc3','#d9a8c1','#a6b7eb','#e8a17b','#b5c888','#d1b2ff'];
const lightVoiceColors = ['#9c7518','#1f7a6c','#a34474','#3c5cb8','#b8562b','#527323','#7a4ec2'];
const load = src => new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = src;
    script.onload = resolve;
    script.onerror = () => { script.remove(); reject(new Error(src + ' unavailable')); };
    document.head.append(script);
});
function missing() {
    document.querySelector('h1').textContent = 'Piece not found';
    for (const part of document.querySelectorAll('canvas, .controls, .sheet, footer, .neighbours')) part.hidden = true;
}
(async () => {
    // Both ids only ever name files inside this repo.
    if (!/^[a-z-]+$/.test(composerId) || !/^[a-z0-9-]+$/.test(folder) || !Number.isInteger(movementIndex)) return missing();
    document.querySelector('.back').href = 'composer.html?c=' + composerId;
    try {
        await Promise.all([load('composers/' + composerId + '.js'), load('pieces/' + folder + '/notes.js')]);
    } catch { return missing(); }
    await load('pieces/' + folder + '/measures.js').catch(() => {});
    await load('notation/' + folder + '/' + movementIndex + '.js').catch(() => {});
    const composer = COMPOSERS[composerId];
    const movement = score.movements[movementIndex];
    const link = 'piece.html?c=' + composerId + '&p=' + folder + '&m=' + movementIndex;
    const works = composer.sections.flatMap(section => section.works ?? section.pairs.flatMap(pair => pair.links));
    const work = works.find(item => item.href === link);
    if (!movement || !work) return missing();
    // The works on either side, in the order of the composer's page.
    const at = works.indexOf(work);
    for (const [neighbour, rel, label] of [[works[at - 1], 'prev', text => '← ' + text], [works[at + 1], 'next', text => text + ' →']]) {
        if (!neighbour) continue;
        const anchor = document.createElement('a');
        anchor.href = neighbour.href;
        anchor.rel = rel;
        anchor.textContent = label(neighbour.heading);
        document.querySelector('.neighbours').append(anchor);
    }
    start(composer, work, movement);
})();

function start(composer, work, movement) {
document.title = work.heading + ' · ' + composer.name;
document.querySelector('.composer').textContent = composer.name;
document.querySelector('h1').textContent = work.heading;
document.querySelector('header p').textContent = work.sub;
document.querySelector('#brief').textContent = work.brief ?? '';
document.querySelector('#brief').hidden = !work.brief;
const edition = document.querySelector('#edition');
edition.textContent = work.score.text;
edition.href = work.score.href;
document.querySelector('.recording').hidden = !work.recording;
document.querySelector('#performer').textContent = work.recording?.text;
document.querySelector('#recording-link').href = 'https://www.youtube.com/watch?v=' + work.recording?.video + (work.recording?.start ? '&t=' + work.recording.start + 's' : '');

// Beats are quarter notes. Without measure data a beat is one second.
const notation = movement.notation?.bars.length ? movement.notation : null;
const tempoMap = (notation?.tempo ?? [[0, 0, 60]]).map(([seconds, beat, bpm]) => ({beat, seconds, secondsPerBeat: 60 / bpm}));
function scoreSeconds(beat) {
    const segment = tempoMap.findLast(entry => entry.beat <= beat) ?? tempoMap[0];
    return segment.seconds + (beat - segment.beat) * segment.secondsPerBeat;
}
function scoreBeat(seconds) {
    const segment = tempoMap.findLast(entry => entry.seconds <= seconds) ?? tempoMap[0];
    return segment.beat + (seconds - segment.seconds) / segment.secondsPerBeat;
}
// One voice per hand, highest first; or the written voices in order, where the movement names
// them ({names, groups, instruments}: a group is the toggle and colour a voice shares). Notes
// struck together for the same length form a chord. An ensemble movement may also set its gain,
// the stereo seating of its instruments, legato (true, or the sixteenth-note onsets bowed on from
// the note before, per voice) and a jump ({label, title, beat}) offered beside the controls.
const hands = new Map();
for (const [seconds, pitch, length, hand, velocity] of movement.notes) {
    if (!hands.has(hand)) hands.set(hand, []);
    const t = scoreBeat(seconds);
    hands.get(hand).push({t, length: scoreBeat(seconds + length) - t, pitches: [pitch], level: (velocity ?? 82) / 100});
}
const mean = notes => notes.reduce((sum, n) => sum + n.pitches[0], 0) / notes.length;
const written = movement.voices;
const ordered = written ? [...hands.keys()].sort((a, b) => a - b).map(hand => hands.get(hand)) : [...hands.values()].sort((a, b) => mean(b) - mean(a));
const voices = ordered.map(notes => {
    const chords = [];
    for (const n of notes.sort((a, b) => a.t - b.t || a.pitches[0] - b.pitches[0])) {
        const last = chords.at(-1);
        if (last && Math.abs(last.t - n.t) < .001 && Math.abs(last.length - n.length) < .001) last.pitches.push(n.pitches[0]);
        else chords.push(n);
    }
    return chords;
});
const names = written?.names ?? (voices.length === 1 ? ['Piano'] : voices.length === 2 ? ['Upper', 'Lower'] : voices.map((_, i) => 'Part ' + (i + 1)));
const groups = written?.groups ?? voices.map((_, i) => i);
let totalBeats = 0;
for (const part of voices) {
    for (const n of part) {
        const end = n.t + n.length;
        if (end > totalBeats) totalBeats = end;
    }
}
// Measures as heard: [beat, label, index of the printed measure]. The engraving knows the
// print, including repeats and cadenzas; otherwise measures.js numbers them.
const sheet = typeof ENGRAVING === 'undefined' ? null : ENGRAVING;
// A printed measure that only finishes the one before it (after a repeat sign) is never played to,
// so measures are numbered by their place among the printed measures that are.
const played = sheet && [...new Set(sheet.play.map(([, printed]) => printed))].sort((x, y) => x - y);
// An engraving may instead give its own label for each measure heard.
const heard = sheet?.labels
    ? sheet.play.map(([beat, printed], i) => [beat, sheet.labels[i], printed])
    : sheet
    ? sheet.play.filter(([, printed], i, all) => printed !== all[i - 1]?.[1])
        .map(([beat, printed]) => [beat, played.indexOf(printed) + (sheet.pickup ? 0 : 1), printed])
    : (notation?.bars ?? []).map(([beat, number]) => [beat, number]);
const bars = heard.map(([beat]) => beat);
const lastNumber = sheet && !sheet.labels ? played.length - (sheet.pickup ? 1 : 0) : heard.at(-1)?.[1];
let sheetView = null;
if (sheet) {
    document.querySelector('#sheet-pdf').href = sheet.pdf;
    if (!sheet.pdf.includes('.pdf')) document.querySelector('#sheet-pdf').textContent = 'Encoded score';
    // Trim the page margins, keeping room for the brace and clefs, unless the images are already cropped (`full`).
    const left = sheet.full ? 0 : Math.max(0, Math.min(...sheet.bars.map(([, x]) => x)) - 45);
    sheetView = {
        width: sheet.width, left,
        viewWidth: (sheet.full ? sheet.width : Math.min(sheet.width, Math.max(...sheet.bars.map(([, x, width]) => x + width)) + 20)) - left,
        bars: sheet.bars.map(([system, x, width]) => ({...sheet.systems[system], file: 'notation/' + sheet.systems[system].file, x, width})),
        printed: index => heard[index][2],
    };
}
// Show about eleven seconds of music, whatever the tempo.
const span = Math.max(8, Math.min(48, Math.round(11 * totalBeats / scoreSeconds(totalBeats))));
const instruments = written?.instruments ?? voices.map(() => 'piano');
const bowed = Array.isArray(movement.legato) ? movement.legato.map(onsets => new Set(onsets)) : [];
if (instruments.some(instrument => instrument !== 'piano')) {
    const concerto = instruments.includes('harpsichord');
    const samples = document.querySelector('#samples');
    samples.href = concerto ? 'bach-data/concerto-credits.txt' : 'bach-data/ensemble-credits.txt';
    samples.textContent = concerto ? 'Concerto samples' : instruments.includes('organ') ? 'Pipe organ samples' : 'String samples';
}
const keyMap = (notation?.bars ?? []).filter(b => typeof b[3] === 'number').map(([beat, , , fifths]) => [beat, fifths]);
let video;
const player = startPlayer({
    title: work.heading, voices, groups, names, colors: voiceColors, lightColors: lightVoiceColors,
    instruments, tempoMap, totalBeats, bars, keyMap,
    label: index => heard[index][1] === 0 ? 'Pickup' : 'm. ' + heard[index][1], lastLabel: lastNumber,
    sheet: sheetView, span,
    // Fast pieces show more beats at once, so their dots shrink to stay apart.
    dotScale: Math.min(1, Math.sqrt(16 / span)), dotMax: 10, gain: movement.gain ?? .6, seating: movement.seating,
    legato: movement.legato && ((voice, note) => movement.legato === true || bowed[voice]?.has(Math.round(note.t * 4))),
    bpm: 60 / tempoMap[0].secondsPerBeat,
    // One performance at a time: hold the recording where it is.
    onPlay: () => video?.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":[]}', 'https://www.youtube-nocookie.com'),
});
if (movement.jump) {
    const jump = document.createElement('button');
    jump.textContent = movement.jump.label;
    jump.title = movement.jump.title;
    jump.onclick = () => player.seekTo(movement.jump.beat);
    document.querySelector('.controls').append(jump);
}
// The recording host is contacted only when the listener asks for the recording.
const watch = document.querySelector('#watch');
if (location.protocol === 'file:') watch.remove(); // YouTube refuses to play inside a local file
watch.onclick = () => {
    player.stop();
    video = document.createElement('iframe');
    video.title = work.heading + ' · ' + work.recording.text;
    video.allow = 'autoplay; encrypted-media; fullscreen; picture-in-picture';
    video.allowFullscreen = true;
    video.referrerPolicy = 'strict-origin-when-cross-origin';
    video.src = 'https://www.youtube-nocookie.com/embed/' + work.recording.video + '?autoplay=1&enablejsapi=1' + (work.recording.start ? '&start=' + work.recording.start : '');
    watch.replaceWith(video);
};
// A click inside the embed moves focus into it; that is the listener starting the recording.
addEventListener('blur', () => { if (player.isRunning() && document.activeElement === video) player.stop(); });
}
</script></html>
