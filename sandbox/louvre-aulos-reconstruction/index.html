    <main>
        <h1>Louvre aulos reconstruction</h1>
        <p>Change the effective length of each idealized closed pipe and sound the pair. Compare their interval in cents.</p>
        <div id="experiment"></div>
        
    </main>
    <footer><p><a href="https://www.emousike.com/louvreaulos">eMousike</a></p><nav aria-label="Experiment sequence"><a href="../railways-and-postal-routes/index.html">← Previous · Railways and postal routes</a> <a href="../japanese-manuscript-and-woodblock-maps/index.html">Next · Japanese manuscript and woodblock maps →</a></nav></footer>
    <script src="../shared/lab.js"></script>
    <script>
let a=4,b=3,ctx;const lengths=[42,39,35,32,29,26];
function hz(i){return 343/(4*lengths[i]/100);}
function draw(){statusLine.textContent='Left '+hz(a).toFixed(1)+' Hz · right '+hz(b).toFixed(1)+' Hz · interval '+Math.round(1200*Math.log2(hz(b)/hz(a)))+' cents.';}
menu('Left pipe length',lengths.map(x=>x+' cm'),v=>{a=v;draw();}).value=a;
menu('Right pipe length',lengths.map(x=>x+' cm'),v=>{b=v;draw();}).value=b;
button('Hear both pipes',async()=>{try{ctx??=new AudioContext();await ctx.resume();for(const v of [a,b]){const o=ctx.createOscillator(),g=ctx.createGain();o.type='triangle';o.frequency.value=hz(v);g.gain.setValueAtTime(.05,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.8);o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+.81);}}catch{statusLine.textContent='Audio unavailable.';}});draw();
</script>
</body>
