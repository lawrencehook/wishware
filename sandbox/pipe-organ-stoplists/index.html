    <main>
        <h1>Pipe organ stoplists</h1>
        <p>Combine three idealized organ stops on middle C and hear which octaves each rank adds.</p>
        <div id="experiment"></div>
        
    </main>
    <footer><p><a href="https://organhistoricalsociety.org/about-the-ohs/pipe-organ-database/">Organ Historical Society Pipe Organ Database</a></p><nav aria-label="Experiment sequence"><a href="../japanese-manuscript-and-woodblock-maps/index.html">← Previous · Japanese manuscript and woodblock maps</a> <a href="../historical-paper-earthquake-records/index.html">Next · Historical paper earthquake records →</a></nav></footer>
    <script src="../shared/lab.js"></script>
    <script>
let context;const harmonics=[1,2,4],active=[true,false,false];
function report(){statusLine.textContent='Sounding frequencies: '+harmonics.filter((_,i)=>active[i]).map(h=>(h*261.63).toFixed(1)+' Hz').join(', ');}
harmonics.forEach((h,i)=>button(['8-foot principal','4-foot octave','2-foot superoctave'][i],()=>{active[i]=!active[i];report();}));
button('Sound middle C',async()=>{try{context??=new AudioContext();await context.resume();for(let i=0;i<3;i++)if(active[i]){
 const osc=context.createOscillator(),gain=context.createGain();osc.frequency.value=261.63*harmonics[i];gain.gain.setValueAtTime(.065,context.currentTime);gain.gain.exponentialRampToValueAtTime(.001,context.currentTime+.9);
 osc.connect(gain).connect(context.destination);osc.start();osc.stop(context.currentTime+.91);}}catch{statusLine.textContent='Audio unavailable.';}});report();
</script>
