        <h1>Ships’ weather logs</h1>
        <p>Follow the Swan from Bermuda toward Mona Island in May 1800. Step through recorded positions and wind bearings.</p>
        <div id="experiment"></div>
        
    </main>
    <footer><p><a href="https://doi.org/10.1594/PANGAEA.743343">PANGAEA dataset</a></p><p><a href="https://doi.org/10.1594/PANGAEA.752408">García-Herrera and colleagues · Swan voyage · PANGAEA, CC BY 3.0</a></p><nav aria-label="Experiment sequence"><a href="../atp-synthase-rotor-structure/index.html">← Previous · ATP synthase rotor structure</a> <a href="../fire-insurance-maps/index.html">Next · Fire insurance maps →</a></nav></footer>
    <script src="../shared/lab.js"></script>
    <script>const sample = [["1800-05-11",32.73,-63.45,141],["1800-05-12",33.37,-63.53,175],["1800-05-13",33.52,-61.5,218],["1800-05-14",33.13,-61.13,61],["1800-05-15",30.75,-60.0,244],["1800-05-16",29.38,-59.6,266],["1800-05-17",28.5,-59.37,19],["1800-05-18",27.9,-59.57,362],["1800-05-19",26.1,-59.95,112],["1800-05-20",24.08,-60.83,112],["1800-05-21",21.6,-62.1,114],["1800-05-22",19.25,-63.28,103],["1800-05-23",18.83,-65.57,115]];</script><script>
const g=board('Longitude and latitude track for the Swan, May 1800. Gold points toward the wind source.');
const map=([date,lat,lon])=>[75+(lon+70)*100,280-(lat-18)*16];
function draw(i){clear(g);line(g,sample.map(map),'#466963',2);line(g,sample.slice(0,i+1).map(map),mint,4);
 const [x,y]=map(sample[i]),[dt,lat,lon,dir]=sample[i];dot(g,x,y,6);
 if(dir<=360&&dir!==null){const a=dir*Math.PI/180;line(g,[[x,y],[x+28*Math.sin(a),y-28*Math.cos(a)]],gold,4);}
 statusLine.textContent=dt+' · '+lat+'° latitude, '+lon+'° longitude · wind from '+(dir===null?'unrecorded direction':dir>360?'variable direction':dir+'°')+'.';}
slider('Log entry',1,sample.length,1,v=>draw(v-1));draw(0);
</script>
