    <main>
        <h1>Ligeti — Musica ricercata</h1>
        <p>Advance through a pitch-limited exercise and see exactly when another pitch class enters.</p>
        <div id="experiment"></div>
        
    </main>
    <footer><p><a href="https://www.schott-music.com/en/musica-ricercata-noc38244.html">Schott Music</a></p><nav aria-label="Experiment sequence"><a href="../church-bell-ringing/index.html">← Previous · Church bell ringing</a> <a href="../glass-complete-piano-etudes/index.html">Next · Glass — Complete Piano Etudes →</a></nav></footer>
    <script src="../shared/lab.js"></script>
    <script>
const g=board('Pitch classes illuminate on their first appearance in a pitch-limited exercise.');
const melody=[69,57,69,81,69,57,69,81,69,57,74],names=['C','C♯','D','E♭','E','F','F♯','G','A♭','A','B♭','B'];
let at=0,ctx;function draw(){clear(g);const used=new Set(melody.slice(0,at).map(p=>p%12));
 names.forEach((name,i)=>{g.fillStyle=used.has(i)?gold:'#50685e';g.fillRect(30+i*75,85,64,110);labelAt(g,name,47+i*75,152,used.has(i)?'#172822':white);});
 statusLine.textContent=at+' attacks · '+used.size+' distinct pitch classes.';}
button('Play next attack',async()=>{if(at===melody.length)at=0;const p=melody[at++];draw();try{ctx??=new AudioContext();await ctx.resume();const o=ctx.createOscillator(),v=ctx.createGain();o.frequency.value=440*2**((p-69)/12);v.gain.setValueAtTime(.12,ctx.currentTime);v.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.3);o.connect(v).connect(ctx.destination);o.start();o.stop(ctx.currentTime+.31);}catch{statusLine.textContent+=' Audio unavailable.';}});
button('Reset',()=>{at=0;draw();});draw();
</script>
